name: Atualizar índice RONI

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-roni:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar e converter dados RONI (NOAA CPC)
        run: node scripts/update-roni.mjs

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/roni.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados do RONI."
          else
            git commit -m "Atualiza dados do índice RONI (NOAA)"
            git push
          fi
