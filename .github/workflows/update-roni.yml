name: Atualizar dados ambientais

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar e converter dados RONI (NOAA CPC)
        run: node scripts/update-roni.mjs

      - name: Atualizar snapshot de nível do mar (IOC/UNESCO)
        run: node scripts/update-sea-level.mjs

      - name: Atualizar previsão de riscos geo-hidrológicos (Cemaden)
        run: node scripts/update-cemaden-risk.mjs

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/roni.json data/sea-level.json data/cemaden-risk.json data/cemaden-risk-history.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados ambientais."
          else
            git commit -m "Atualiza dados ambientais"
            git push
          fi
